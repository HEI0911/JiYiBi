name: Release

# 推送 v* 标签时自动构建 APK 并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Android 构建需要 JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 拉取 Flutter 最新稳定版（和本地开发环境保持一致）
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 打印 Flutter 版本
        run: flutter --version

      - name: 安装依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 构建 APK
        run: flutter build apk --release

      - name: 重命名产物
        run: mv build/app/outputs/flutter-apk/app-release.apk "jiyibi-app-${GITHUB_REF_NAME}.apk"

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: jiyibi-app-*.apk
