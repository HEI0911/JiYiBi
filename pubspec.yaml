name: jiyibi_app
description: 记一笔 App - 3秒记账，分类管理，数据可视化
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  fl_chart: ^0.68.0
  intl: ^0.20.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Smiley Sans
      fonts:
        - asset: assets/fonts/SmileySans-Oblique.ttf
  # 得意黑遵循 SIL OFL 1.1，许可见 assets/fonts/LICENSE-SmileySans.txt
